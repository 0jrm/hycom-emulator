[project]
name = "hycom-emulator"
version = "0.0.1"
description = "Learned surrogate of one HYCOM + TSIS cycle on GOMb0.04"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
# Readers and fingerprints that touch HYCOM/TSIS files on RCC.
build = ["gom-da", "netCDF4"]
test = ["pytest"]

[tool.uv.sources]
gom-da = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hycom_emulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
