name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.12,<2.13"
          pip install -e ".[ml,test]" netCDF4 xarray zarr scipy matplotlib cartopy
      - name: Test
        run: python -m pytest -q -rs
